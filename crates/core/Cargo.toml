[package]
name = "pst-viewer-core"
description = "Read-only mail archive engine (PST, MSG, EML, MBOX) shared by the iOS and Android apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "pst_viewer_core"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
ammonia = "4.2.1"
base64 = "0.23.1"
cfb = "0.15.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
compressed-rtf = "1.0.1"
encoding_rs = "0.8.42"
html-escape = "0.2.15"
mail-builder = { version = "1.0.0", default-features = false }
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
outlook-pst = "1.2.0"
regex = "1.13.1"
thiserror = "2.0.21"
uniffi = "0.32.2"
unicode-normalization = "0.1.25"

[dev-dependencies]
tempfile = "3"
