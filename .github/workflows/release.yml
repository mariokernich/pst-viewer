# Releases with release-please: every push to main updates a release pull
# request (next version from Conventional Commits, changelog). Merging it tags
# the version, creates the GitHub release and builds the downloads below.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Rebuild and upload the downloads of an existing release (e.g. v1.0.0)
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A personal access token makes the release pull request (and its
          # squash commit) yours instead of github-actions[bot], and lets CI
          # run on it. Falls back to the workflow token.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  desktop:
    needs: release-please
    if: needs.release-please.outputs.created == 'true' || inputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: --mac
            files: apps/desktop/dist/*.dmg
          - os: windows-latest
            platform: --win
            # Only the per-architecture installers, not the combined one.
            files: apps/desktop/dist/*-x64-setup.exe apps/desktop/dist/*-arm64-setup.exe
          - os: ubuntu-latest
            platform: --linux
            files: apps/desktop/dist/*.AppImage apps/desktop/dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pst-viewer/desktop build
      - name: Package
        shell: bash
        working-directory: apps/desktop
        env:
          # Optional code signing (see docs/release.md). Without these secrets
          # the builds are unsigned.
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERTIFICATE || secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERTIFICATE_PASSWORD || secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Notarization of the Mac builds with the App Store Connect API key.
          ASC_KEY: ${{ matrix.os == 'macos-latest' && secrets.APP_STORE_CONNECT_API_KEY || '' }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD
            echo "::warning::No signing certificate configured, building unsigned."
          elif [ -n "$ASC_KEY" ]; then
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
            echo "$ASC_KEY" | base64 --decode > "$APPLE_API_KEY"
            export APPLE_API_KEY_ID="$ASC_KEY_ID" APPLE_API_ISSUER="$ASC_ISSUER_ID"
          fi
          pnpm exec electron-builder ${{ matrix.platform }} --publish never
          if [ -n "${APPLE_API_KEY:-}" ]; then
            rm -f "$APPLE_API_KEY"
            # electron-builder notarizes and staples the app inside the DMGs.
            for app in dist/mac*/*.app; do xcrun stapler validate "$app"; done
          fi
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag || inputs.tag }}" ${{ matrix.files }} --clobber

  android:
    needs: release-please
    if: needs.release-please.outputs.created == 'true' || inputs.tag != ''
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check signing key
        id: signing
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, the APK is not built (see docs/release.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.signing.outputs.enabled == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - if: steps.signing.outputs.enabled == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - if: steps.signing.outputs.enabled == 'true'
        run: sdkmanager "ndk;30.0.16248370"
      - if: steps.signing.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - if: steps.signing.outputs.enabled == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: steps.signing.outputs.enabled == 'true'
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build the signed APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: apps/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
          PST_VIEWER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PST_VIEWER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PST_VIEWER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          export PST_VIEWER_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/PST-Viewer-android.apk"
      - name: Upload to the release
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag || inputs.tag }}" "$RUNNER_TEMP/PST-Viewer-android.apk" --clobber

  # Uploads the iPhone/iPad app and the Mac App Store package to App Store
  # Connect (TestFlight). Submitting for review stays manual. Needs the App
  # Store secrets from docs/release.md, otherwise the job is skipped.
  app-store:
    needs: release-please
    if: needs.release-please.outputs.created == 'true' || inputs.tag != ''
    runs-on: macos-latest
    env:
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      # Grows with every run; App Store Connect needs a new build number per upload.
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      IOS_PROFILE_NAME: PST Viewer iOS App Store CI
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$ASC_KEY" ]; then
            echo "::warning::App Store secrets are not set, nothing is uploaded (see docs/release.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select the newest Xcode
        if: steps.secrets.outputs.enabled == 'true'
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - if: steps.secrets.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - if: steps.secrets.outputs.enabled == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: steps.secrets.outputs.enabled == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.secrets.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - if: steps.secrets.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install certificates, profiles and API key
        if: steps.secrets.outputs.enabled == 'true'
        env:
          DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          DISTRIBUTION_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          INSTALLER_P12: ${{ secrets.MAC_INSTALLER_P12 }}
          INSTALLER_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          MAC_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN" -P "$DISTRIBUTION_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" -P "$INSTALLER_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP"/*.p12
          security find-identity -v "$KEYCHAIN"

          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            echo "$IOS_PROFILE" | base64 --decode > "$dir/pst-viewer-ios-ci.mobileprovision"
          done
          echo "$MAC_PROFILE" | base64 --decode > apps/desktop/build/embedded.provisionprofile

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
      - name: iPhone and iPad
        if: steps.secrets.outputs.enabled == 'true'
        run: tools/app-store/upload.sh ios
      - name: Mac App Store
        if: steps.secrets.outputs.enabled == 'true' && !cancelled()
        run: tools/app-store/upload.sh mac
      - name: Clean up
        if: always() && steps.secrets.outputs.enabled == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf "$HOME/.appstoreconnect" apps/desktop/build/embedded.provisionprofile
