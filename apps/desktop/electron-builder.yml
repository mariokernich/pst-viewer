appId: de.kernich.pstviewer
productName: PST Viewer
copyright: Copyright © 2026 Mario Kernich

directories:
  buildResources: build
  output: dist

# Releases are uploaded by the GitHub workflow (.github/workflows/release.yml).
# Artifact names carry no version, so the website can link to
# https://github.com/mariokernich/pst-viewer/releases/latest/download/<name>.
publish: null

files:
  - out/**
  - package.json
  - '!**/*.map'

# Mail files can be opened in the viewer (read-only, never as editor). Only
# .pst is claimed as default; mail apps stay the default for the others.
fileAssociations:
  - ext: pst
    name: Outlook Data File
    description: Outlook Data File
    role: Viewer
    icon: build/icon.png
  - ext: msg
    name: Outlook Item
    description: Outlook Item
    role: Viewer
    rank: Alternate
    icon: build/icon.png
  - ext: [eml, emlx]
    name: Email Message
    description: Email Message
    role: Viewer
    rank: Alternate
    icon: build/icon.png
  - ext: mbox
    name: Mailbox
    description: Mailbox (MBOX)
    role: Viewer
    rank: Alternate
    icon: build/icon.png

# Harden the packaged app (https://www.electronjs.org/docs/latest/tutorial/fuses).
electronFuses:
  # Re-sign ad hoc after flipping fuses so unsigned local builds run on Apple Silicon.
  resetAdHocDarwinSignature: true
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

mac:
  category: public.app-category.productivity
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
  hardenedRuntime: true
  darkModeSupport: true
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 Mario Kernich

dmg:
  artifactName: PST-Viewer-mac-${arch}.${ext}

# Mac App Store: `APPLE_TEAM_ID=… pnpm dist:mas` (scripts/dist-mas.cjs adds the
# team id, see docs/store-release.md). The app runs in the App Sandbox; recent
# files are reopened through security-scoped bookmarks (src/main/sandbox.ts).
mas:
  type: distribution
  hardenedRuntime: false
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  provisioningProfile: build/embedded.provisionprofile
  extendInfo:
    ITSAppUsesNonExemptEncryption: false

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]

# Microsoft Store (MSIX/AppX), built on Windows: `pnpm dist:appx`
# (scripts/dist-appx.cjs adds identity name and publisher from Partner Center,
# see docs/store-release.md). The logos in build/appx are rendered with
# `pnpm store-assets`.
appx:
  publisherDisplayName: Mario Kernich
  applicationId: PSTViewer
  displayName: PST Viewer
  backgroundColor: transparent
  showNameOnTiles: false
  languages:
    - de-DE
    - en-US

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: PST-Viewer-windows-${arch}-setup.${ext}

linux:
  # Without it, electron-builder derives the name from "@pst-viewer/desktop".
  executableName: pst-viewer
  # Window class and .desktop file name match, so desktops group the windows.
  syncDesktopName: true
  icon: build/icon.png
  category: Office
  target: [AppImage, deb]
  maintainer: Mario Kernich <mario@kernich.de>

appImage:
  artifactName: PST-Viewer-linux-x86_64.${ext}

deb:
  artifactName: PST-Viewer-linux-amd64.${ext}
